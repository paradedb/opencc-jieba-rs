name: Rust build + test

on:
  workflow_dispatch:  # Allows manual triggering
  # Upstream's default branch is `master` and it leaves these triggers off.
  # Ours is `main`, and the Upstream Rebase workflow blocks on check runs
  # against the `target-patch-*` branch it pushes, so this has to run there.
  push:
    branches: [ "main", "target-patch-*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
